<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Celo Karma Box</title>
    <script src="https://cdn.jsdelivr.net/npm/@farcaster/frame-sdk@0.0.18/dist/index.min.js"></script>
    <style>
        body {
            background-color: #0f172a;
            color: #f8fafc;
            font-family: system-ui, -apple-system, sans-serif;
            text-align: center;
            padding: 20px;
            margin: 0;
        }
        .card {
            max-width: 400px;
            margin: 40px auto;
            background: #1e293b;
            padding: 30px;
            border-radius: 20px;
            border: 2px solid #34d399;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
        }
        h1 { color: #34d399; margin-bottom: 5px; }
        .btn {
            background-color: #34d399;
            color: #0f172a;
            border: none;
            padding: 15px 30px;
            font-size: 18px;
            font-weight: bold;
            border-radius: 12px;
            cursor: pointer;
            width: 100%;
            margin-top: 20px;
            transition: 0.2s;
        }
        .btn:hover { background-color: #059669; color: white; }
        .status { margin-top: 20px; font-weight: bold; color: #94a3b8; }
    </style>
</head>
<body>

<div class="card">
    <h1>🌱 Celo Karma Box</h1>
    <p>Hem Celo ağında gerçek işlem (tx) kas, hem de doğaya destek ol!</p>
    
    <div style="font-size: 80px; margin: 20px 0;">🎁</div>
    
    <button class="btn" id="txBtn" onclick="sendCeloTx()">Kutuyu Aç (0.01 CELO)</button>
    <div class="status" id="statusText">Farcaster Cüzdanı Bekleniyor...</div>
</div>

<script>
    // Uygulama açıldığında Farcaster SDK'sını başlatıyoruz
    window.addEventListener('DOMContentLoaded', () => {
        if (window.farcaster && window.farcaster.sdk) {
            window.farcaster.sdk.actions.ready();
            document.getElementById('statusText').innerHTML = "Cüzdan bağlantısı hazır! 🚀";
        } else {
            document.getElementById('statusText').innerHTML = "Lütfen bu uygulamayı Farcaster (Warpcast/Supercast) içinden açın.";
        }
    });

    async function sendCeloTx() {
        const status = document.getElementById('statusText');
        status.innerHTML = "Cüzdan onayı bekleniyor... 🔑";
        
        try {
            // İŞTE CÜZDANI AÇTIRAN VE GERÇEK TX ATTIRAN KISIM BURASI:
            // Bu kod kullanıcının önüne "0.01 CELO gönderilsin mi?" onay ekranını çıkartır.
            const result = await window.farcaster.sdk.actions.sendTx({
                chainId: 42220, // Celo Mainnet Ağ Kodu
                to: "0xc467972a2Fa614c5f6990968D9d47b70DB169f5E", // Buraya KENDİ CELO CÜZDAN ADRESİNİ yazacaksın! Kopya CELO'lar sana gelecek.
                value: "10000000000000000" // 0.01 CELO'nun akıllı sözleşme dilindeki karşılığı
            });

            if(result) {
                status.style.color = "#34d399";
                status.innerHTML = "🎉 İşlem Başarılı! Tx atıldı. Şansına: +50 Karma Puanı Kazandın! 🌟";
            }
        } catch (error) {
            status.style.color = "#f87171";
            status.innerHTML = "❌ İşlem iptal edildi veya bir hata oluştu.";
            console.error(error);
        }
    }
</script>

</body>
</html>
