<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Celo Hazine Avı</title>
    <style>
        body {
            background-color: #121212;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            text-align: center;
            padding: 20px;
            margin: 0;
        }
        .container {
            max-width: 500px;
            margin: 50px auto;
            background: #1e1e1e;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            border: 2px solid #FBCC5C;
        }
        h1 { color: #FBCC5C; margin-bottom: 10px; }
        p { color: #aaaaaa; font-size: 16px; }
        .grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
            margin: 30px 0;
        }
        .box {
            background-color: #2a2a2a;
            border: 2px solid #444;
            border-radius: 10px;
            padding: 25px 10px;
            font-size: 18px;
            cursor: pointer;
            transition: all 0.3s ease;
            color: white;
        }
        .box:hover {
            transform: scale(1.05);
            border-color: #FBCC5C;
        }
        .box:disabled { cursor: not-down; transform: none; }
        .btn {
            background-color: #FBCC5C;
            color: #000;
            border: none;
            padding: 12px 25px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            margin-top: 15px;
            display: none;
        }
        #status { font-size: 18px; margin-top: 20px; font-weight: bold; }
    </style>
</head>
<body>

<div class="container">
    <h1>🏝️ Celo Hazine Avı</h1>
    <p>6 gizemli kutudan birinde büyük CELO ödülü var. Şanslı kutuyu bulabilir misin?</p>
    
    <div class="grid">
        <button class="box" onclick="kutuAc(1, this)">📦 1</button>
        <button class="box" onclick="kutuAc(2, this)">📦 2</button>
        <button class="box" onclick="kutuAc(3, this)">📦 3</button>
        <button class="box" onclick="kutuAc(4, this)">📦 4</button>
        <button class="box" onclick="kutuAc(5, this)">📦 5</button>
        <button class="box" onclick="kutuAc(6, this)">📦 6</button>
    </div>

    <div id="status">Seçimini yap ve kutuyu aç!</div>
    <button id="resetBtn" class="btn" onclick="oyunuSifirla()">Yeniden Oyna 🔄</button>
</div>

<script>
    let dogruKutu = Math.floor(Math.random() * 6) + 1;
    let oyunBitti = false;

    function kutuAc(kutuNo, buton) {
        if(oyunBitti) return;
        
        oyunBitti = true;
        // Tüm kutuları kilitle
        let butonlar = document.querySelectorAll('.box');
        butonlar.forEach(b => b.disabled = true);

        let durum = document.getElementById('status');
        
        if(kutuNo === dogruKutu) {
            buton.style.backgroundColor = "#4CAF50";
            buton.innerHTML = "👑 ÖDÜL";
            durum.innerHTML = "🎉 TEBRİKLER! Doğru kutuyu buldun ve sanal CELO ödülünü kazandın!";
            durum.style.color = "#4CAF50";
        } else {
            buton.style.backgroundColor = "#f44336";
            buton.innerHTML = "❌ BOŞ";
            durum.innerHTML = `😢 Maalesef boş çıktı! Büyük ödül ${dogruKutu}. kutudaydı.`;
            durum.style.color = "#f44336";
        }
        
        document.getElementById('resetBtn').style.display = "inline-block";
    }

    function oyunuSifirla() {
        dogruKutu = Math.floor(Math.random() * 6) + 1;
        oyunBitti = false;
        
        let butonlar = document.querySelectorAll('.box');
        butonlar.forEach((b, index) => {
            b.disabled = false;
            b.style.backgroundColor = "#2a2a2a";
            b.innerHTML = `📦 ${index + 1}`;
        });
        
        let durum = document.getElementById('status');
        durum.innerHTML = "Seçimini yap ve kutuyu aç!";
        durum.style.color = "#ffffff";
        document.getElementById('resetBtn').style.display = "none";
    }
</script>

</body>
</html>
